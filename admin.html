<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運営ギフト送信</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0e1424;color:#eef2ff}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#26345d 0,#0e1424 45%)}main{max-width:760px;margin:0 auto;padding:48px 20px}.card{background:#171f35;border:1px solid #303d60;border-radius:18px;padding:28px;box-shadow:0 18px 60px #0005}h1{margin:0 0 8px;font-size:28px}p{color:#aeb9d4}.badge{display:inline-block;color:#9de9c1;background:#143f36;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}label{display:block;margin:18px 0 7px;font-weight:650}input,textarea{box-sizing:border-box;width:100%;padding:12px 13px;border-radius:10px;border:1px solid #455579;background:#0e1528;color:inherit;font-size:15px}textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{margin-top:24px;width:100%;padding:13px;border:0;border-radius:10px;background:#6d7cff;color:white;font-weight:750;font-size:15px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.notice{margin-top:18px;padding:12px;border-radius:10px;display:none}.ok{display:block;background:#153e31;color:#b6f5d6}.error{display:block;background:#4d202a;color:#ffc4cf}.small{font-size:12px;color:#8290b0}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="card"><span class="badge">運営専用</span><h1>プレイヤーへギフトを送信</h1><p>サーバー側で運営権限を検証し、Firestoreのトランザクションで残高と監査ログを同時に更新します。</p><div id="session" class="small">認証状態を確認中…</div><form id="gift-form" hidden><label for="uid">対象ユーザーUID</label><input id="uid" name="uid" required maxlength="128" pattern="[A-Za-z0-9:_-]+" placeholder="player_uid"><div class="grid"><div><label for="coins">コイン</label><input id="coins" name="coins" type="number" min="0" max="1000000000" step="1" value="0"></div><div><label for="xp">XP</label><input id="xp" name="xp" type="number" min="0" max="1000000000" step="1" value="0"></div></div><label for="note">メモ（任意）</label><textarea id="note" name="note" maxlength="500" placeholder="補填理由・キャンペーン名など"></textarea><button id="send" type="submit">ギフトを送信</button></form><div id="notice" class="notice" role="status"></div></div></main><script>
const $=s=>document.querySelector(s), form=$('#gift-form'), notice=$('#notice');
const tokenProvider=window.getAdminIdToken; // Firebase SDKを既存アプリ側で注入する契約
async function token(){if(typeof tokenProvider!=='function')throw Error('Firebaseログイン連携が未設定です。既存アプリから window.getAdminIdToken を注入してください。');return tokenProvider();}
function key(){return crypto.randomUUID().replaceAll('-','')}
(async()=>{try{await fetch('/api/admin/session',{headers:{Authorization:'Bearer '+await token()}}).then(async r=>{if(!r.ok)throw Error((await r.json()).error);return r.json()});$('#session').textContent='運営権限を確認しました';form.hidden=false}catch(e){$('#session').textContent=e.message;$('#session').className='error'}})();
form.addEventListener('submit',async e=>{e.preventDefault();notice.className='notice';notice.textContent='';$('#send').disabled=true;const fd=new FormData(form);const body={uid:fd.get('uid'),coins:Number(fd.get('coins')),xp:Number(fd.get('xp')),note:fd.get('note'),idempotencyKey:key()};try{const r=await fetch('/api/admin/gifts',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await token()},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error+(data.details?'\n'+data.details.join('\n'):''));notice.className='notice ok';notice.textContent=data.status==='duplicate'?'同じ送信は既に処理済みです。':'送信しました。監査ログID: '+data.gift.id;form.reset();$('#coins').value=0;$('#xp').value=0}catch(err){notice.className='notice error';notice.textContent=err.message}finally{$('#send').disabled=false}});
</script></body></html>
