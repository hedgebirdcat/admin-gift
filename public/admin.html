<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運営ギフト送信</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0e1424;color:#eef2ff}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#26345d 0,#0e1424 45%)}main{max-width:760px;margin:0 auto;padding:48px 20px}.card{background:#171f35;border:1px solid #303d60;border-radius:18px;padding:28px;box-shadow:0 18px 60px #0005}h1{margin:0 0 8px;font-size:28px}p{color:#aeb9d4}.badge{display:inline-block;color:#9de9c1;background:#143f36;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}label{display:block;margin:18px 0 7px;font-weight:650}input,textarea{box-sizing:border-box;width:100%;padding:12px 13px;border-radius:10px;border:1px solid #455579;background:#0e1528;color:inherit;font-size:15px}textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{margin-top:24px;width:100%;padding:13px;border:0;border-radius:10px;background:#6d7cff;color:white;font-weight:750;font-size:15px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.notice{margin-top:18px;padding:12px;border-radius:10px;white-space:pre-line;display:none}.ok{display:block;background:#153e31;color:#b6f5d6}.error{display:block;background:#4d202a;color:#ffc4cf}.small{font-size:12px;color:#8290b0}.logout{background:#394661;margin-top:10px}
</style></head><body><main><div class="card"><span class="badge">運営専用</span><h1>プレイヤーへギフトを送信</h1><p>運営アカウントでログインしてから利用してください。</p><div id="session" class="small">Firebase設定を確認中…</div>
<section id="login"><label for="email">運営メールアドレス</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="login-button" type="button">ログイン</button></section>
<form id="gift-form" hidden novalidate><label for="uid">対象ユーザーUID</label><input id="uid" name="uid" maxlength="128" placeholder="player_uid"><div class="grid"><div><label for="coins">コイン</label><input id="coins" name="coins" inputmode="numeric" value="0"></div><div><label for="xp">XP</label><input id="xp" name="xp" inputmode="numeric" value="0"></div></div><label for="note">メモ（任意）</label><textarea id="note" name="note" maxlength="500" placeholder="補填理由・キャンペーン名など"></textarea><button id="send" type="button">ギフトを送信</button><button id="logout" class="logout" type="button">ログアウト</button></form><div id="notice" class="notice" role="status"></div></div></main>
<!-- Firebase Console > プロジェクトの設定 > マイアプリ > Webアプリの設定をここへ貼り付けます。Web設定は公開可能ですが秘密鍵は貼らないでください。 -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script>
const firebaseConfig={apiKey:'AIzaSyBo2qwC-PSXgUjq6x96zlvb-RJ8CXxyi1o',authDomain:'hatchoria-unei.firebaseapp.com',projectId:'hatchoria-unei',storageBucket:'hatchoria-unei.firebasestorage.app',messagingSenderId:'1097333927370',appId:'1:1097333927370:web:b07adfa572aedb9fb93333'};
const configured=!Object.values(firebaseConfig).some(v=>String(v).startsWith('ここに'));
if(configured){firebase.initializeApp(firebaseConfig);window.getAdminIdToken=()=>firebase.auth().currentUser.getIdToken(true);firebase.auth().onAuthStateChanged(user=>{if(user){$('#login').hidden=true;$('#gift-form').hidden=false;$('#session').textContent=`ログイン中: ${user.email||user.uid}`;}else{$('#login').hidden=false;$('#gift-form').hidden=true;$('#session').textContent='運営アカウントでログインしてください';}});}else{$('#session').textContent='Firebase設定が未入力です。画面下の設定欄をREADMEの手順で置き換えてください';}
const $=s=>document.querySelector(s),notice=$('#notice');function show(text,kind='error'){notice.className='notice '+kind;notice.textContent=text}
$('#login-button').addEventListener('click',async()=>{try{if(!configured)throw Error('Firebase設定が未入力です');await firebase.auth().signInWithEmailAndPassword($('#email').value.trim(),$('#password').value);show('ログインしました','ok')}catch(e){show('ログインできません: '+e.message)}});
$('#logout').addEventListener('click',()=>firebase.auth().signOut());function key(){let source='';try{if(globalThis.crypto&&typeof globalThis.crypto.randomUUID==='function')source=globalThis.crypto.randomUUID()}catch(_e){}if(!source)source=Date.now().toString(36)+Math.random().toString(36).slice(2)+Date.now().toString(36);return source.replace(/[^A-Za-z0-9]/g,'').slice(0,64).padEnd(16,'0')}
$('#send').addEventListener('click',async()=>{notice.className='notice';const uid=$('#uid').value.trim();const coins=Number.parseInt(String($('#coins').value).trim()||'0',10);const xp=Number.parseInt(String($('#xp').value).trim()||'0',10);if(!/^[A-Za-z0-9:_-]{1,128}$/.test(uid)){show('UIDは英数字・ハイフン・アンダースコアで入力してください');return}if(!Number.isSafeInteger(coins)||coins<0||!Number.isSafeInteger(xp)||xp<0||(coins===0&&xp===0)){show('コインまたはXPを1以上の整数で入力してください');return}$('#send').disabled=true;const body={uid,coins,xp,note:$('#note').value.trim(),idempotencyKey:key()};try{const r=await fetch('/api/admin/gifts',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await window.getAdminIdToken()},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error+(data.details?'\n'+data.details.join('\n'):''));show(data.status==='duplicate'?'同じ送信は既に処理済みです。':'送信しました。監査ログID: '+data.gift.id,'ok');$('#uid').value='';$('#coins').value='0';$('#xp').value='0';$('#note').value=''}catch(err){show(err.message)}finally{$('#send').disabled=false}});
</script></body></html>
